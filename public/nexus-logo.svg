<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="600" height="160">
  <defs>
    <!-- Glow for the X core -->
    <filter id="x-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="x-core-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Gradients -->
    <linearGradient id="g-main" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#7b00ff"/>
      <stop offset="100%" stop-color="#ff00e4"/>
    </linearGradient>
    <linearGradient id="g-x" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="50%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#ff00e4"/>
    </linearGradient>
  </defs>

  <!-- Dark background circle/pill for contrast -->
  <rect x="0" y="20" width="600" height="120" rx="60" fill="#0a0e1a" opacity="0.5"/>

  <!-- N letter -->
  <g transform="translate(30, 30)">
    <path d="M10,100 L10,10 L40,10 L70,100 L70,10 L100,10 L100,100 L60,100 L25,20 L25,100 Z" fill="#e0e8ff" opacity="0.9"/>
  </g>

  <!-- E letter -->
  <g transform="translate(135, 30)">
    <rect x="10" y="10" width="80" height="12" rx="2" fill="#e0e8ff" opacity="0.9"/>
    <rect x="10" y="78" width="80" height="12" rx="2" fill="#e0e8ff" opacity="0.9"/>
    <rect x="10" y="44" width="65" height="12" rx="2" fill="#e0e8ff" opacity="0.7"/>
    <rect x="10" y="10" width="12" height="90" rx="2" fill="#e0e8ff" opacity="0.9"/>
  </g>

  <!-- X letter -- THE CORE. Intersecting triangles form the X -->
  <g transform="translate(235, 0)" filter="url(#x-glow)">
    <!-- X as intersecting triangles -->
    <!-- Left-right stroke -->
    <polygon points="60,30 100,70 60,110 20,70" fill="none" stroke="url(#g-x)" stroke-width="4" opacity="0.9"/>
    <!-- Left stroke outer glow triangle -->
    <polygon points="60,30 100,70 60,110 20,70" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.3"/>

    <!-- Inner triangle node at center -->
    <polygon points="60,58 72,70 48,70" fill="#00ff88" opacity="0.8" filter="url(#x-core-glow)"/>

    <!-- Center core glow -->
    <circle cx="60" cy="70" r="4" fill="#ffffff" filter="url(#x-core-glow)"/>
  </g>

  <!-- U letter -->
  <g transform="translate(350, 30)">
    <rect x="10" y="10" width="12" height="72" rx="2" fill="#e0e8ff" opacity="0.9"/>
    <rect x="68" y="10" width="12" height="72" rx="2" fill="#e0e8ff" opacity="0.9"/>
    <rect x="10" y="82" width="70" height="12" rx="2" fill="#e0e8ff" opacity="0.9"/>
    <path d="M22,10 Q40,0 68,10" fill="none" stroke="#e0e8ff" stroke-width="3" opacity="0.3"/>
  </g>

  <!-- S letter -->
  <g transform="translate(445, 30)">
    <path d="M75,20 Q75,10 55,10 L25,10 Q10,10 10,25 Q10,45 75,50 Q80,50 80,70 Q80,90 50,90 L20,90 Q10,90 10,75" fill="none" stroke="#e0e8ff" stroke-width="11" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- Tagline / slogan -->
  <text x="300" y="135" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" letter-spacing="4" fill="#4a5578" text-anchor="middle" text-transform="uppercase">
    The Core of Your AGI
  </text>

  <!-- Bottom accent line -->
  <line x1="200" y1="140" x2="400" y2="140" stroke="url(#g-main)" stroke-width="1" opacity="0.3"/>
</svg>
