[package]
name = "nexus"
version = "0.1.0"
description = "Nexus — The Core of Your AGI. A desktop agent built on hermes-agent-rs."
license = "MIT"
edition = "2021"
rust-version = "1.75"
repository = "https://github.com/junagent/nexus"

[build-dependencies]
tauri-build = "2"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
tauri = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"
futures-util = "0.3"
async-trait = "0.1"
rusqlite = { version = "0.31", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"

# hermes-agent-rs integration (future)
# hermes-core = { git = "https://github.com/Lumio-Research/hermes-agent-rs" }
